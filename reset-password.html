<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NegotiatorIQ — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --red: #C40000; --ink: #130F0F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 20px; }
  p.subtext { font-size: 13px; color: #666; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d8dade;
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 18px;
  }
  input:focus { outline: none; border-color: var(--red); }
  button {
    width: 100%;
    padding: 12px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .message { border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 18px; display: none; }
  .message.error { background: #fdecea; color: #b3261e; display: block; }
  .message.success { background: #e8f5e9; color: #2e7d32; display: block; }
</style>
</head>
<body>

<div class="card">
  <h1>Set a new password</h1>
  <p class="subtext" id="subtext">Enter and confirm your new password below.</p>

  <div id="message-box" class="message"></div>

  <form id="reset-form">
    <label for="password">New password</label>
    <input type="password" id="password" autocomplete="new-password" required minlength="6">

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" autocomplete="new-password" required minlength="6">

    <button type="submit" id="submit-btn">Update Password</button>
  </form>
</div>

<script type="module">
  import { supabaseClient } from './js/supabaseClient.js';

  const form = document.getElementById('reset-form');
  const msgBox = document.getElementById('message-box');
  const submitBtn = document.getElementById('submit-btn');
  const subtext = document.getElementById('subtext');

  function showMessage(text, type) {
    msgBox.textContent = text;
    msgBox.className = `message ${type}`;
  }

  let recoveryReady = false;

  supabaseClient.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
    }
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    recoveryReady = true;
  }

  if (!recoveryReady) {
    showMessage('This reset link is invalid or has expired. Request a new one from the Supabase dashboard.', 'error');
    form.style.display = 'none';
    subtext.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password !== confirm) {
      showMessage('Passwords do not match.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    const { error } = await supabaseClient.auth.updateUser({ password });

    if (error) {
      showMessage(error.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
      return;
    }

    showMessage('Password updated. Redirecting to sign in...', 'success');
    form.style.display = 'none';

    await supabaseClient.auth.signOut();

    setTimeout(() => {
      window.location.href = './login.html';
    }, 1800);
  });
</script>

</body>
</html>
